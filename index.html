<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Word Block</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, #34407a 0%, #1b1f3d 60%, #12142a 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  canvas { display: block; position: absolute; inset: 0; }
  #over {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: rgba(10, 12, 30, .78); text-align: center; padding: 16px;
  }
  #over.show { display: flex; }
  #over h2 { font-size: 34px; letter-spacing: 1px; }
  #over .big { font-size: 56px; font-weight: 800; color: #ffd93b; }
  #over .sub { opacity: .8; font-size: 15px; max-width: 320px; line-height: 1.4; }
  #over button {
    margin-top: 8px; font: inherit; font-size: 20px; font-weight: 700; color: #1b1f3d;
    background: #ffd93b; border: 0; border-radius: 14px; padding: 14px 40px; cursor: pointer;
    box-shadow: 0 5px 0 #c49d12;
  }
  #over button:active { transform: translateY(3px); box-shadow: 0 2px 0 #c49d12; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="over">
  <h2>Oyun Bitti</h2>
  <div class="big" id="finalScore">0</div>
  <div class="sub" id="finalInfo"></div>
  <button id="again">Tekrar Oyna</button>
</div>

const N = 8;
let board, tray, score, best = 0, combo, foundWords, moves;

function newBoard() { return Array.from({ length: N }, () => Array(N).fill(null)); }

function randomShape(maxCells = 9, bigBias = 0) {
  const pool = SHAPES.filter(s => s[1].length <= maxCells).map(s => [s[0] * Math.pow(s[1].length / 3, bigBias), s[1]]);
  let sum = 0; for (const s of pool) sum += s[0];
  let r = Math.random() * sum;
  for (const s of pool) { r -= s[0]; if (r <= 0) return s[1]; }
  return pool[0][1];
}

function makePiece(shape) {
  const w = Math.max(...shape.map(c => c[0])) + 1, h = Math.max(...shape.map(c => c[1])) + 1;
  return { cells: shape.map(([x, y]) => ({ x, y, l: randLetter() })), w, h, color: COLORS[(Math.random() * COLORS.length) | 0], used: false };
}

function rerollLetters(p) { p.cells.forEach(c => c.l = randLetter()); }

function canPlace(b, p, gx, gy) {
  for (const c of p.cells) {

    if (x < 0 || y < 0 || x >= N || y >= N || b[y][x]) return false;
  }
  return true;
}

// Parçayı (gx,gy)'ye koyarsak oluşacak kelimeler ve dolan satır/sütunlar
function evaluate(b, p, gx, gy) {
  const g = b.map(r => r.slice());
  const isNew = new Set();
  for (const c of p.cells) { g[gy + c.y][gx + c.x] = { l: c.l, color: p.color }; isNew.add((gy + c.y) * N + gx + c.x); }
  const rows = new Set(p.cells.map(c => gy + c.y)), cols = new Set(p.cells.map(c => gx + c.x));
  const found = []; // {word, cells:[idx]}
  const scanLine = (idxs) => {
    for (let i = 0; i < N; i++) {
      for (let len = 3; len <= MAX_WORD && i + len <= N; len++) {
        const seg = idxs.slice(i, i + len);
        if (seg.some(k => !g[(k / N) | 0][k % N])) break;
        if (!seg.some(k => isNew.has(k))) continue;
        const w = seg.map(k => g[(k / N) | 0][k % N].l).join('');
        if (DICT.has(w)) found.push({ word: w, cells: seg });
      }
    }
  };
  for (const y of rows) scanLine(Array.from({ length: N }, (_, x) => y * N + x));
  for (const x of cols) scanLine(Array.from({ length: N }, (_, y) => y * N + x));
  // Başka bir kelimenin içinde kalan kısa kelimeleri listeden çıkar (hücreleri zaten temizleniyor)
  const words = found.filter(f => !found.some(o => o !== f && o.cells.length > f.cells.length && f.cells.every(k => o.cells.includes(k))));
  const lines = [];
  for (const y of rows) if (g[y].every(Boolean)) lines.push(Array.from({ length: N }, (_, x) => y * N + x));
  for (const x of cols) if (g.every(r => r[x])) lines.push(Array.from({ length: N }, (_, y) => y * N + x));
  const clear = new Set();
  words.forEach(f => f.cells.forEach(k => clear.add(k)));
  lines.forEach(l => l.forEach(k => clear.add(k)));
  return { words, lines, clear };
}

// Parçanın kendi içinde kelime olmasın (bedava puan olmasın)
function selfWord(p) {

function pieceFrom(cells) {

function findCompletions(st) {
  const out = [];

    const ch = [...w], n = ch.length;

function buildCompletion(c, st, taken) {

    let cells = base.slice();
    if (ext) {
      const end = pick([cells[0], cells[cells.length - 1]]), side = pick([-1, 1]);
      cells.push(c.dir === 'h' ? { x: end.x, y: end.y + side, l: chunkLetters(1)[0] } : { x: end.x + side, y: end.y, l: chunkLetters(1)[0] });
    }
    const p = pieceFrom(cells), px = gx + p.ox, py = gy + p.oy;
    if (selfWord(p) || !canPlace(board, p, px, py)) continue;
    const cellsKey = p.cells.map(k => (py + k.y) * N + px + k.x);
    if (cellsKey.some(k => taken.has(k))) continue;
    if (!evaluate(board, p, px, py).words.some(f => f.word === c.w)) continue;
    cellsKey.forEach(k => taken.add(k));
    p.target = c.w;
    return p;
  }
  return null;
}

// İki parça yan yana gelince kelime: boş tahtada da çalışır
function buildPair(st) {
  const list = shuffle(wordsIn(st.len));
  for (let t = 0; t < 60 && t < list.length; t++) {
    const ch = [...list[t]], n = ch.length, dir = pick(['h', 'v']);
    let free = false;
    for (let a = 0; a < N && !free; a++) for (let s = 0; s + n <= N && !free; s++) {
      free = true;
      for (let i = 0; i < n; i++) if (dir === 'h' ? board[a][s + i] : board[s + i][a]) { free = false; break; }
    }
    if (!free) continue;
    const k = 1 + rnd(n - 1);
    const p1 = pieceFrom(lineCells(ch.slice(0, k), dir)), p2 = pieceFrom(lineCells(ch.slice(k), dir));
    if (selfWord(p1) || selfWord(p2)) continue;
    p1.target = p2.target = list[t];
    return [p1, p2];
  }
  return null;
}

function buildFiller(st) {
  for (let t = 0; t < 40; t++) {
    const shape = randomShape(st.maxCells, st.bigBias).slice().sort((a, b) => a[1] - b[1] || a[0] - b[0]);
    const ls = Math.random() < st.randFill ? shape.map(randLetter) : chunkLetters(shape.length);
    const p = pieceFrom(shape.map(([x, y], i) => ({ x, y, l: ls[i] })));
    if (!selfWord(p)) return p;
  }
  const p = makePiece(randomShape(st.maxCells, st.bigBias));
  return p;
}

function refillTray() {
  const st = STAGES[stageOf(score)], taken = new Set();
  let pieces = [];
  const comps = findCompletions(st);
  let helpers = Math.random() < st.helperP ? st.helpers : 0;
  // Tahta boşsa ya da şans tutarsa: birbirini tamamlayan iki parça
  if (helpers && (!comps.length || Math.random() < st.pairP)) {
    const pr = buildPair(st);
    if (pr) { pieces.push(...pr); helpers--; }
  }
  for (const c of comps) {
    if (helpers <= 0 || pieces.length >= 3) break;
    if (pieces.some(p => p.target === c.w)) continue;
    const p = buildCompletion(c, st, taken);
    if (p) { pieces.push(p); helpers--; }
  }
  while (pieces.length < 3) pieces.push(buildFiller(st));
  tray = shuffle(pieces);
}

// Başlangıç tahtası: yarım kalmış birkaç kelime
function seedBoard() {
  for (let t = 0; t < 50; t++) {
    board = newBoard();
    const list = shuffle(wordsIn([3, 4]));
    let placed = 0;
    for (const w of list) {
      if (placed >= 3) break;
      const ch = [...w], n = ch.length, dir = pick(['h', 'v']);
      const a = rnd(N), s = rnd(N - n + 1);
      const pos = ch.map((_, i) => dir === 'h' ? [s + i, a] : [a, s + i]);
      // Etrafında boşluk olsun ki parçalar sığsın
      if (pos.some(([x, y]) => [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => board[y + dy] && board[y + dy][x + dx]))) continue;
      const missN = n === 3 ? 1 : 1 + rnd(2), m0 = pick([0, n - missN]);
      pos.forEach(([x, y], i) => { if (i < m0 || i >= m0 + missN) board[y][x] = { l: ch[i], color: pick(COLORS), pop: 1 }; });
      placed++;
    }
    if (!boardHasWord()) return;
  }
  board = newBoard();
}

function boardHasWord() {
  const lines = [];
  for (let i = 0; i < N; i++) { lines.push(board[i].map(c => c ? c.l : '.')); lines.push(board.map(r => r[i] ? r[i].l : '.')); }
  return lines.some(a => { for (let i = 0; i < N; i++) for (let j = i + 3; j <= N; j++) if (DICT.has(a.slice(i, j).join(''))) return true; return false; });
}

function anyMove() {
  for (const p of tray) {
    if (p.used) continue;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (canPlace(board, p, x, y)) return true;
  }
  return false;
}

function start() {
  board = newBoard(); score = 0; combo = 0; moves = 0; foundWords = [];
  shownScore = 0; anims = []; particles = []; floats = [];
  seedBoard();
  refillTray();
  document.getElementById('over').classList.remove('show');
}

// ---------- Yerleştirme ----------
function place(p, gx, gy) {
  const res = evaluate(board, p, gx, gy);
  for (const c of p.cells) board[gy + c.y][gx + c.x] = { l: c.l, color: p.color, pop: 0 };
  p.used = true; moves++;
  let gain = p.cells.length;
  if (res.clear.size) {
    combo++;
    const mult = Math.min(combo, 4);
    let wordPts = 0;
    res.words.forEach(f => { wordPts += f.word.length * f.word.length * 10; });
    const linePts = res.lines.length * 80;
    const pts = (wordPts + linePts) * mult;
    gain += pts;
    // efektler
    for (const k of res.clear) {
      const x = k % N, y = (k / N) | 0, cell = board[y][x];
      anims.push({ x, y, l: cell.l, color: cell.color, t: 0 });
      burst(x, y, cell.color);
      board[y][x] = null;
    }
    res.words.forEach((f, i) => {
      foundWords.unshift(f.word);
      const mid = f.cells[(f.cells.length / 2) | 0];
      floats.push({ text: f.word, sub: '+' + f.word.length * f.word.length * 10 * mult, x: mid % N + 0.5, y: ((mid / N) | 0) + 0.5, t: -i * 0.18, color: '#ffd93b' });
    });
    if (res.lines.length) {
      const k = res.lines[0][4];
      floats.push({ text: res.lines.length > 1 ? L.lines(res.lines.length) : L.line, sub: '+' + linePts * mult, x: k % N + 0.5, y: ((k / N) | 0) + 0.5, t: -res.words.length * 0.18, color: '#7fe3ff' });
    }
    if (mult > 1) floats.push({ text: L.combo + mult, sub: '', x: 4, y: 1, t: -0.3, color: '#ff8adf' });
    foundWords = foundWords.slice(0, 12);
  } else {
    combo = 0;
  }
  const prevStage = stageOf(score);
  score += gain;
  if (stageOf(score) > prevStage) floats.push({ text: L.level + ' ' + (stageOf(score) + 1), sub: '', x: 4, y: 3.5, t: -0.5, color: '#7dffb0' });
  if (score > best) { best = score; try { localStorage.setItem('wordblock-best-' + lang, best); } catch (e) {} }
  if (tray.every(t => t.used)) refillTray();
  if (!anyMove()) setTimeout(gameOver, 700);
}

function gameOver() {
  document.getElementById('finalScore').textContent = score;
  const uniq = [...new Set(foundWords)];
  document.getElementById('finalInfo').textContent = uniq.length ? L.last + uniq.slice(0, 8).join(', ') : L.none;
  document.getElementById('over').classList.add('show');
}
document.getElementById('again').onclick = start;

// ---------- Çizim ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR, cell, bx, by, trayY, traySlots = [], shownScore = 0;
let anims = [], particles = [], floats = [];

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const maxBoard = Math.min(W - 32, 460, (H - 290));
  cell = Math.floor(maxBoard / N);
  const bw = cell * N;
  bx = Math.round((W - bw) / 2);
  const total = 120 + bw + 30 + cell * 3.2;
  by = Math.round(Math.max(110, (H - total) / 2 + 110));
  trayY = by + bw + 28;
  const slotW = Math.min(bw / 3, 160);
  traySlots = [0, 1, 2].map(i => ({ x: W / 2 + (i - 1) * slotW, y: trayY + cell * 1.5, w: slotW, h: cell * 3 }));
}
addEventListener('resize', layout);

function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f > 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; } else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

function drawBlock(x, y, s, color, letter, alpha = 1, glow = false) {
  ctx.save(); ctx.globalAlpha = alpha;
  const p = Math.max(1, s * 0.04), r = s * 0.16;
  if (glow) { ctx.shadowColor = '#fff6a8'; ctx.shadowBlur = s * 0.5; }
  ctx.fillStyle = shade(color, -0.35); rr(x + p, y + p, s - 2 * p, s - 2 * p, r); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = color; rr(x + p, y + p, s - 2 * p, s - 2 * p - s * 0.09, r); ctx.fill();
  ctx.fillStyle = shade(color, 0.3); rr(x + p + s * 0.1, y + p + s * 0.06, s - 2 * p - s * 0.2, s * 0.12, s * 0.06); ctx.fill();
  if (letter) {
    ctx.font = `800 ${Math.round(s * 0.56)}px -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(2, s * 0.09); ctx.strokeStyle = shade(color, -0.5); ctx.lineJoin = 'round';
    ctx.strokeText(letter, x + s / 2, y + s * 0.47);
    ctx.fillStyle = '#fff'; ctx.fillText(letter, x + s / 2, y + s * 0.47);
  }
  if (glow) { ctx.strokeStyle = '#fff6a8'; ctx.lineWidth = Math.max(2, s * 0.07); rr(x + p, y + p, s - 2 * p, s - 2 * p, r); ctx.stroke(); }
  ctx.restore();
}

function burst(gx, gy, color) {
  const cx = bx + (gx + 0.5) * cell, cy = by + (gy + 0.5) * cell;
  for (let i = 0; i < 7; i++) {
    const a = Math.random() * Math.PI * 2, v = (2 + Math.random() * 4) * cell / 40;
    particles.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, s: cell * (0.12 + Math.random() * 0.15), color, life: 1 });
  }
}

// ---------- Sürükleme ----------
let drag = null; // {p, i, px, py, gx, gy, valid, eval}
const LIFT = () => cell * 1.6;

function langBtn() { const w = 76, h = 26; return { x: bx + cell * N - w, y: by - 88 - h / 2, w, h }; }

function trayScale(p, slot) { return Math.min(0.55, (slot.w * 0.85) / (p.w * cell), (slot.h * 0.85) / (p.h * cell)); }

function pos(e) { return { x: e.clientX, y: e.clientY }; }

cv.addEventListener('pointerdown', e => {
  if (document.getElementById('over').classList.contains('show')) return;
  const { x, y } = pos(e);
  const lb = langBtn();
  if (x >= lb.x && x <= lb.x + lb.w && y >= lb.y - 6 && y <= lb.y + lb.h + 6) {
    const nl = x < lb.x + lb.w / 2 ? 'tr' : 'en';
    if (nl !== lang) { setLang(nl); start(); }
    return;
  }
  traySlots.forEach((s, i) => {
    const p = tray[i];
    if (p.used || drag) return;
    if (Math.abs(x - s.x) < s.w / 2 && Math.abs(y - s.y) < s.h / 2 + 10) {
      drag = { p, i, px: x, py: y };
      cv.setPointerCapture(e.pointerId);
      updateDrag();
    }
  });
});
cv.addEventListener('pointermove', e => { if (!drag) return; const { x, y } = pos(e); drag.px = x; drag.py = y; updateDrag(); });
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { drag = null; });

function updateDrag() {
  const p = drag.p;
  const left = drag.px - p.w * cell / 2, top = drag.py - LIFT() - p.h * cell / 2;
  const gx = Math.round((left - bx) / cell), gy = Math.round((top - by) / cell);
  drag.left = left; drag.top = top;
  drag.valid = canPlace(board, p, gx, gy);
  drag.gx = gx; drag.gy = gy;
  drag.eval = drag.valid ? evaluate(board, p, gx, gy) : null;
}
function endDrag() {
  if (!drag) return;
  if (drag.valid) place(drag.p, drag.gx, drag.gy);
  drag = null;
}

// ---------- Döngü ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // Üst bilgi
  shownScore += (score - shownScore) * Math.min(1, dt * 10);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  ctx.font = '800 22px -apple-system, "Segoe UI", sans-serif';
  ctx.fillText('WORD BLOCK', W / 2, by - 88);
  ctx.font = '800 40px -apple-system, "Segoe UI", sans-serif';
  ctx.fillText(Math.round(shownScore), W / 2, by - 52);
  ctx.font = '600 13px -apple-system, "Segoe UI", sans-serif'; ctx.fillStyle = '#ffd93b';
  ctx.textAlign = 'left'; ctx.fillText('👑 ' + best, bx, by - 88);
  ctx.fillStyle = '#7dffb0'; ctx.fillText(L.level + ' ' + (stageOf(score) + 1), bx, by - 60);
  // Son kelimeler
  ctx.textAlign = 'center'; ctx.font = '700 13px -apple-system, "Segoe UI", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText(foundWords.length ? foundWords.slice(0, 5).join(' · ') : L.hint, W / 2, by - 18);
  // Dil seçici
  const lb = langBtn();
  ctx.fillStyle = 'rgba(8,10,28,.55)'; rr(lb.x, lb.y, lb.w, lb.h, lb.h / 2); ctx.fill();
  ['tr', 'en'].forEach((k, i) => {
    const hx = lb.x + i * lb.w / 2;
    if (k === lang) { ctx.fillStyle = '#ffd93b'; rr(hx + 2, lb.y + 2, lb.w / 2 - 4, lb.h - 4, (lb.h - 4) / 2); ctx.fill(); }
    ctx.fillStyle = k === lang ? '#1b1f3d' : 'rgba(255,255,255,.7)';
    ctx.font = '800 12px -apple-system, "Segoe UI", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(k.toUpperCase(), hx + lb.w / 4, lb.y + lb.h / 2 + 1);
  });

  // Tahta
  const bw = cell * N;
  ctx.fillStyle = 'rgba(8,10,28,.55)'; rr(bx - 8, by - 8, bw + 16, bw + 16, 14); ctx.fill();
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    ctx.fillStyle = 'rgba(255,255,255,.05)'; rr(bx + x * cell + 2, by + y * cell + 2, cell - 4, cell - 4, cell * 0.14); ctx.fill();
  }
  const hl = new Set(drag && drag.eval ? drag.eval.clear : []);
  const pulse = 0.75 + 0.25 * Math.sin(now / 120);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const c = board[y][x]; if (!c) continue;
    if (c.pop < 1) c.pop = Math.min(1, c.pop + dt * 7);
    const s = cell * (0.85 + 0.15 * easeOutBack(c.pop));
    drawBlock(bx + x * cell + (cell - s) / 2, by + y * cell + (cell - s) / 2, s, c.color, c.l, hl.has(y * N + x) ? pulse : 1, hl.has(y * N + x));
  }
  // Gölge önizleme
  if (drag && drag.valid) {
    for (const c of drag.p.cells) {
      const k = (drag.gy + c.y) * N + drag.gx + c.x;
      drawBlock(bx + (drag.gx + c.x) * cell, by + (drag.gy + c.y) * cell, cell, drag.p.color, c.l, hl.has(k) ? 0.9 : 0.4, hl.has(k));
    }
  }
  // Patlama animasyonları
  anims = anims.filter(a => (a.t += dt * 3.2) < 1);
  for (const a of anims) {
    const s = cell * (1 + a.t * 0.4);
    drawBlock(bx + a.x * cell + (cell - s) / 2, by + a.y * cell + (cell - s) / 2, s, a.color, a.l, 1 - a.t);
  }
  particles = particles.filter(p => (p.life -= dt * 1.6) > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.25;
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color; rr(p.x, p.y, p.s, p.s, p.s * 0.25); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Tepsi
  traySlots.forEach((s, i) => {
    const p = tray[i];
    if (p.used || (drag && drag.i === i)) return;
    const sc = trayScale(p, s), cs = cell * sc;
    const fits = (() => { for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (canPlace(board, p, x, y)) return true; return false; })();
    const ox = s.x - p.w * cs / 2, oy = s.y - p.h * cs / 2;
    for (const c of p.cells) drawBlock(ox + c.x * cs, oy + c.y * cs, cs, fits ? p.color : '#666a80', c.l, fits ? 1 : 0.6);
  });

  // Sürüklenen parça
  if (drag) {
    for (const c of drag.p.cells) drawBlock(drag.left + c.x * cell, drag.top + c.y * cell, cell, drag.p.color, c.l, 0.95);
  }

  // Yüzen yazılar
  floats = floats.filter(f => (f.t += dt * 0.9) < 1);
  for (const f of floats) {
    if (f.t < 0) continue;
    const k = Math.min(1, f.t * 6), x = bx + f.x * cell, y = by + f.y * cell - f.t * cell * 1.6;
    ctx.save(); ctx.globalAlpha = f.t > 0.7 ? (1 - f.t) / 0.3 : 1;
    ctx.translate(x, y); ctx.scale(0.6 + 0.4 * easeOutBack(k), 0.6 + 0.4 * easeOutBack(k));
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.font = `900 ${Math.round(cell * 0.75)}px -apple-system, "Segoe UI", sans-serif`;
    ctx.lineWidth = 6; ctx.strokeStyle = '#1b1f3d'; ctx.strokeText(f.text, 0, 0);
    ctx.fillStyle = f.color; ctx.fillText(f.text, 0, 0);
    if (f.sub) {
      ctx.font = `800 ${Math.round(cell * 0.42)}px -apple-system, "Segoe UI", sans-serif`;
      ctx.strokeText(f.sub, 0, cell * 0.6); ctx.fillStyle = '#fff'; ctx.fillText(f.sub, 0, cell * 0.6);
    }
    ctx.restore();
  }

  requestAnimationFrame(frame);
}
function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

let savedLang = 'tr';
try { savedLang = localStorage.getItem('wordblock-lang') || ((navigator.language || '').startsWith('tr') ? 'tr' : 'en'); } catch (e) {}
setLang(LANGS[savedLang] ? savedLang : 'tr');
layout();
start();
requestAnimationFrame(frame);
</script>
</body>
</html>
